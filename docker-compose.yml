services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: v360
      POSTGRES_USER: v360
      POSTGRES_PASSWORD: v360
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v360 -d v360"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/v360
      DB_USERNAME: v360
      DB_PASSWORD: v360
      LOG_FILE: /app/logs/v360-connector.log
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres-data:

