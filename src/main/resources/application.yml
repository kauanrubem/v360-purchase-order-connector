spring:
  application:
    name: purchase-order-connector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/v360}
    username: ${DB_USERNAME:v360}
    password: ${DB_PASSWORD:v360}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

