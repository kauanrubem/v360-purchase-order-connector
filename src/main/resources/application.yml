spring:
  application:
    name: purchase-order-connector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/v360}
    username: ${DB_USERNAME:v360}
    password: ${DB_PASSWORD:v360}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    br.com.v360.purchaseorder: ${LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/v360-connector.log}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{36} - %msg%n"

